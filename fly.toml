# fly.toml — paradox-agentic-ai
# internal_port MUST match the port uvicorn listens on (Dockerfile CMD = 8000)

app = 'paradox-agentic-ai-srza5w'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
